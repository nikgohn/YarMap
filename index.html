<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Исторические карты и разметка города</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Yandex Maps API & Leaflet Yandex Plugin -->
  <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU"></script>
  <script src="https://unpkg.com/leaflet-plugins@3.4.0/layer/tile/Yandex.js"></script>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-panel: rgba(22, 27, 34, 0.88);
      --bg-panel-hover: rgba(30, 36, 46, 0.95);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-color: #388bfd;
      --accent-hover: #58a6ff;
      --accent-active: #1f6feb;
      --radius: 12px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      --blur: blur(14px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: var(--text-main);
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #12151a;
    }

    /* Floating Header / Brand */
    .brand-card {
      position: absolute;
      top: 16px;
      left: 60px;
      z-index: 1000;
      background: var(--bg-panel);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 10px 16px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 600;
      background: rgba(56, 139, 253, 0.2);
      color: var(--accent-hover);
      border: 1px solid rgba(56, 139, 253, 0.4);
      padding: 2px 6px;
      border-radius: 6px;
    }

    /* Main Control Panel */
    .control-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 320px;
      max-height: calc(100vh - 32px);
      z-index: 1000;
      background: var(--bg-panel);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s;
    }

    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .panel-content {
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Mode Switcher Tabs */
    .mode-switch {
      display: flex;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }

    .mode-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .mode-btn:hover {
      color: var(--text-main);
    }

    .mode-btn.active {
      background: var(--accent-color);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(56, 139, 253, 0.35);
    }

    /* Layer Items */
    .layer-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      transition: border-color 0.15s, background 0.15s;
    }

    .layer-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .layer-card.active {
      border-color: rgba(56, 139, 253, 0.5);
      background: rgba(56, 139, 253, 0.08);
    }

    .layer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .layer-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      flex: 1;
    }

    .layer-label input[type="checkbox"],
    .layer-label input[type="radio"] {
      cursor: pointer;
      accent-color: var(--accent-color);
      width: 16px;
      height: 16px;
    }

    /* Slider Container */
    .slider-row {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slider-row label {
      font-size: 11px;
      color: var(--text-muted);
      min-width: 70px;
    }

    .slider-row input[type="range"] {
      flex: 1;
      height: 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .slider-val {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      min-width: 32px;
      text-align: right;
    }

    /* Base Map Select */
    .select-styled {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }

    .select-styled:focus {
      border-color: var(--accent-color);
    }

    /* Action Buttons */
    .btn-action {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    /* Bottom Coordinate Bar */
    .info-bar {
      position: absolute;
      bottom: 12px;
      left: 12px;
      z-index: 1000;
      background: var(--bg-panel);
      backdrop-filter: var(--blur);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }

    /* Interactive Swipe Divider */
    #swipe-divider {
      display: none;
      position: absolute;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #ffffff;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.6);
      z-index: 1500;
      cursor: ew-resize;
      pointer-events: auto;
    }

    #swipe-handle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1a1a1a;
      font-size: 14px;
      cursor: ew-resize;
      user-select: none;
      border: 2px solid var(--accent-color);
    }

    /* Leaflet Control Overrides */
    .leaflet-control-zoom {
      border: none !important;
      box-shadow: var(--shadow) !important;
      border-radius: var(--radius) !important;
      overflow: hidden;
      background: var(--bg-panel) !important;
      backdrop-filter: var(--blur);
    }

    .leaflet-control-zoom a {
      background: var(--bg-panel) !important;
      color: var(--text-main) !important;
      border-bottom: 1px solid var(--border-color) !important;
    }

    .leaflet-control-zoom a:hover {
      background: var(--bg-panel-hover) !important;
      color: var(--accent-hover) !important;
    }

    .leaflet-control-attribution {
      background: rgba(0, 0, 0, 0.5) !important;
      color: rgba(255, 255, 255, 0.5) !important;
      font-size: 10px !important;
    }

    .leaflet-control-attribution a {
      color: rgba(255, 255, 255, 0.7) !important;
    }

    .swipe-hint {
      font-size: 11px;
      color: var(--accent-hover);
      background: rgba(56, 139, 253, 0.12);
      border: 1px solid rgba(56, 139, 253, 0.25);
      border-radius: 6px;
      padding: 6px 10px;
      margin-top: 4px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- Brand Title -->
  <div class="brand-card">
    <div class="brand-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
        <line x1="8" y1="2" x2="8" y2="18"></line>
        <line x1="16" y1="6" x2="16" y2="22"></line>
      </svg>
      Привязка исторических сканов
    </div>
    <span class="brand-badge">3 карты</span>
  </div>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Swipe Divider Bar -->
  <div id="swipe-divider">
    <div id="swipe-handle">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
        <polyline points="9 18 3 12 9 6" style="display:none;"></polyline>
      </svg>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left: -8px;">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </div>
  </div>

  <!-- Control Panel -->
  <div class="control-panel">
    <div class="panel-header">
      <span class="panel-title">Управление слоями</span>
      <button class="btn-action" id="btn-fit" title="Приблизить к планам" style="padding: 4px 8px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
        </svg>
        К центру
      </button>
    </div>

    <div class="panel-content">
      <!-- Mode Selection -->
      <div>
        <div class="section-title">Режим просмотра</div>
        <div class="mode-switch">
          <button class="mode-btn active" id="mode-overlay">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
              <path d="M2 17l10 5 10-5"></path>
              <path d="M2 12l10 5 10-5"></path>
            </svg>
            Наложение
          </button>
          <button class="mode-btn" id="mode-swipe">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="2" x2="12" y2="22"></line>
              <rect x="2" y="5" width="20" height="14" rx="2"></rect>
            </svg>
            Шторка (Swipe)
          </button>
        </div>
      </div>

      <!-- Historical Maps List -->
      <div>
        <div class="section-title">Исторические планы</div>
        
        <!-- Map 1 -->
        <div class="layer-card active" id="card-map1">
          <div class="layer-head">
            <label class="layer-label">
              <input type="checkbox" id="chk-map1" checked />
              <span id="title-map1">План 1 (map1)</span>
            </label>
          </div>
          <div class="slider-row" id="slider-box-map1">
            <label>Прозрачность</label>
            <input type="range" id="op-map1" min="0" max="100" value="85" />
            <span class="slider-val" id="val-map1">85%</span>
          </div>
        </div>

        <!-- Map 2 -->
        <div class="layer-card" id="card-map2">
          <div class="layer-head">
            <label class="layer-label">
              <input type="checkbox" id="chk-map2" />
              <span id="title-map2">План 2 (map2)</span>
            </label>
          </div>
          <div class="slider-row" id="slider-box-map2">
            <label>Прозрачность</label>
            <input type="range" id="op-map2" min="0" max="100" value="85" />
            <span class="slider-val" id="val-map2">85%</span>
          </div>
        </div>

        <!-- Map 3 -->
        <div class="layer-card" id="card-map3">
          <div class="layer-head">
            <label class="layer-label">
              <input type="checkbox" id="chk-map3" />
              <span id="title-map3">План 3 (map3)</span>
            </label>
          </div>
          <div class="slider-row" id="slider-box-map3">
            <label>Прозрачность</label>
            <input type="range" id="op-map3" min="0" max="100" value="85" />
            <span class="slider-val" id="val-map3">85%</span>
          </div>
        </div>

        <div id="swipe-instruction" class="swipe-hint" style="display: none;">
          👉 <b>Режим шторки активен:</b> двигайте белую полосу по центру экрана влево и вправо для сравнения старого плана со спутником.
        </div>
      </div>

      <!-- Base Map Selection -->
      <div>
        <div class="section-title">Современная подложка</div>
        <select class="select-styled" id="basemap-select">
          <option value="esri_sat">Спутник ESRI (Высокое качество)</option>
          <option value="yandex_sat">Спутник Яндекс (Официальный)</option>
          <option value="yandex_hybrid">Яндекс Спутник + Улицы (Гибрид)</option>
          <option value="google_sat">Спутник Google</option>
          <option value="google_hybrid">Спутник Google + Дороги (Гибрид)</option>
          <option value="osm">OpenStreetMap (Схема)</option>
          <option value="carto_dark">Темная схема (CartoDB Dark)</option>
          <option value="carto_light">Светлая схема (CartoDB Light)</option>
        </select>
      </div>

    </div>
  </div>

  <!-- Bottom Info Coordinates -->
  <div class="info-bar" id="coords-bar">Координаты: 57.6250° N, 39.8850° E | Зум: 14</div>

  <script>
    // Initial Center based on generated tiles (Yaroslavl area)
    const INITIAL_CENTER = [57.626, 39.885];
    const INITIAL_ZOOM = 14;

    // Base Maps providers (Strictly synchronized & accurate)
    const baseLayers = {
      esri_sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxNativeZoom: 19,
        maxZoom: 22,
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
      }),
      yandex_sat: typeof L.Yandex !== 'undefined' ? new L.Yandex('satellite') : null,
      yandex_hybrid: typeof L.Yandex !== 'undefined' ? new L.Yandex('hybrid') : null,
      google_sat: L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
        maxNativeZoom: 20,
        maxZoom: 22,
        attribution: '&copy; Google Satellite'
      }),
      google_hybrid: L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        maxNativeZoom: 20,
        maxZoom: 22,
        attribution: '&copy; Google Satellite / Labels'
      }),
      osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxNativeZoom: 19,
        maxZoom: 22,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }),
      carto_dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxNativeZoom: 19,
        maxZoom: 22,
        attribution: '&copy; <a href="https://carto.com/">CARTO</a>'
      }),
      carto_light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        maxNativeZoom: 19,
        maxZoom: 22,
        attribution: '&copy; <a href="https://carto.com/">CARTO</a>'
      })
    };

    // Initialize Map
    const map = L.map('map', {
      center: INITIAL_CENTER,
      zoom: INITIAL_ZOOM,
      maxZoom: 22,
      zoomControl: false,
      layers: [baseLayers.esri_sat]
    });

    // Zoom control in top-left
    L.control.zoom({ position: 'topleft' }).addTo(map);

    // Historical Tile Layers (Relative paths to map1, map2, map3)
    const scanLayers = {
      map1: L.tileLayer('./map1/{z}/{x}/{y}.png', {
        minZoom: 10,
        maxNativeZoom: 19,
        maxZoom: 22,
        opacity: 0.85,
        tms: false,
        zIndex: 10
      }),
      map2: L.tileLayer('./map2/{z}/{x}/{y}.png', {
        minZoom: 10,
        maxNativeZoom: 19,
        maxZoom: 22,
        opacity: 0.85,
        tms: false,
        zIndex: 11
      }),
      map3: L.tileLayer('./map3/{z}/{x}/{y}.png', {
        minZoom: 10,
        maxNativeZoom: 19,
        maxZoom: 22,
        opacity: 0.85,
        tms: false,
        zIndex: 12
      })
    };

    // Add map1 by default
    scanLayers.map1.addTo(map);

    // Current State
    let currentMode = 'overlay'; // 'overlay' | 'swipe'
    let currentBaseKey = 'esri_sat';
    let swipePercent = 50; // 0% to 100%
    let activeSwipeScan = 'map1';

    // UI Elements
    const chk1 = document.getElementById('chk-map1');
    const chk2 = document.getElementById('chk-map2');
    const chk3 = document.getElementById('chk-map3');

    const op1 = document.getElementById('op-map1');
    const op2 = document.getElementById('op-map2');
    const op3 = document.getElementById('op-map3');

    const val1 = document.getElementById('val-map1');
    const val2 = document.getElementById('val-map2');
    const val3 = document.getElementById('val-map3');

    const card1 = document.getElementById('card-map1');
    const card2 = document.getElementById('card-map2');
    const card3 = document.getElementById('card-map3');

    const modeOverlayBtn = document.getElementById('mode-overlay');
    const modeSwipeBtn = document.getElementById('mode-swipe');
    const swipeDivider = document.getElementById('swipe-divider');
    const swipeInstruction = document.getElementById('swipe-instruction');
    const coordsBar = document.getElementById('coords-bar');
    const basemapSelect = document.getElementById('basemap-select');
    const btnFit = document.getElementById('btn-fit');

    // Opacity Sync
    function syncOpacity(key, input, valEl) {
      input.addEventListener('input', (e) => {
        const v = e.target.value;
        valEl.textContent = `${v}%`;
        scanLayers[key].setOpacity(v / 100);
      });
    }
    syncOpacity('map1', op1, val1);
    syncOpacity('map2', op2, val2);
    syncOpacity('map3', op3, val3);

    // Layer Toggle Handlers
    function handleToggle(key, chk, card) {
      chk.addEventListener('change', () => {
        if (currentMode === 'overlay') {
          if (chk.checked) {
            map.addLayer(scanLayers[key]);
            card.classList.add('active');
          } else {
            map.removeLayer(scanLayers[key]);
            card.classList.remove('active');
          }
        } else if (currentMode === 'swipe') {
          // In swipe mode, act as radio button
          activeSwipeScan = key;
          [chk1, chk2, chk3].forEach(c => c.checked = (c === chk));
          [card1, card2, card3].forEach(c => c.classList.remove('active'));
          card.classList.add('active');

          Object.keys(scanLayers).forEach(k => {
            if (k === key) {
              if (!map.hasLayer(scanLayers[k])) map.addLayer(scanLayers[k]);
            } else {
              if (map.hasLayer(scanLayers[k])) map.removeLayer(scanLayers[k]);
            }
          });
          updateSwipeClip();
        }
      });
    }
    handleToggle('map1', chk1, card1);
    handleToggle('map2', chk2, card2);
    handleToggle('map3', chk3, card3);

    // Base Map Changer
    basemapSelect.addEventListener('change', (e) => {
      const newKey = e.target.value;
      if (baseLayers[currentBaseKey] && map.hasLayer(baseLayers[currentBaseKey])) {
        map.removeLayer(baseLayers[currentBaseKey]);
      }
      if (baseLayers[newKey]) {
        baseLayers[newKey].addTo(map);
        if (typeof baseLayers[newKey].bringToBack === 'function') {
          baseLayers[newKey].bringToBack();
        }
        currentBaseKey = newKey;
      }
    });

    // Fit to Center button
    btnFit.addEventListener('click', () => {
      map.flyTo(INITIAL_CENTER, 15, { duration: 1.2 });
    });

    // Mouse coordinates
    map.on('mousemove', (e) => {
      coordsBar.textContent = `Координаты: ${e.latlng.lat.toFixed(5)}° N, ${e.latlng.lng.toFixed(5)}° E | Зум: ${map.getZoom()}`;
    });

    // Swipe Mode Logic
    function updateSwipeClip() {
      if (currentMode !== 'swipe') return;
      const size = map.getSize();
      if (!size.x || !size.y) return;

      const splitPixel = size.x * (swipePercent / 100);
      swipeDivider.style.left = `${splitPixel}px`;

      const nw = map.containerPointToLayerPoint([0, 0]);
      const se = map.containerPointToLayerPoint(size);
      const clipX = nw.x + (se.x - nw.x) * (swipePercent / 100);

      const clipRect = `rect(${nw.y}px, ${clipX}px, ${se.y}px, ${nw.x}px)`;

      Object.keys(scanLayers).forEach(k => {
        const container = scanLayers[k].getContainer();
        if (container) {
          if (k === activeSwipeScan && map.hasLayer(scanLayers[k])) {
            container.style.clip = clipRect;
          } else {
            container.style.clip = 'auto';
          }
        }
      });
    }

    function setMode(mode) {
      currentMode = mode;
      if (mode === 'overlay') {
        modeOverlayBtn.classList.add('active');
        modeSwipeBtn.classList.remove('active');
        swipeDivider.style.display = 'none';
        swipeInstruction.style.display = 'none';

        // Clear clips
        Object.keys(scanLayers).forEach(k => {
          const container = scanLayers[k].getContainer();
          if (container) {
            container.style.clip = 'auto';
          }
        });

        // Restore normal layer checkboxes
        [chk1, chk2, chk3].forEach(c => c.type = 'checkbox');
        if (chk1.checked && !map.hasLayer(scanLayers.map1)) map.addLayer(scanLayers.map1);
        if (chk2.checked && !map.hasLayer(scanLayers.map2)) map.addLayer(scanLayers.map2);
        if (chk3.checked && !map.hasLayer(scanLayers.map3)) map.addLayer(scanLayers.map3);
      } else {
        modeSwipeBtn.classList.add('active');
        modeOverlayBtn.classList.remove('active');
        swipeDivider.style.display = 'block';
        swipeInstruction.style.display = 'block';

        // In swipe mode, ensure only 1 active historical layer
        [chk1, chk2, chk3].forEach(c => c.type = 'radio');
        if (!chk1.checked && !chk2.checked && !chk3.checked) {
          chk1.checked = true;
          activeSwipeScan = 'map1';
        }
        
        Object.keys(scanLayers).forEach(k => {
          const isCurrent = (k === activeSwipeScan);
          if (isCurrent) {
            if (!map.hasLayer(scanLayers[k])) map.addLayer(scanLayers[k]);
          } else {
            if (map.hasLayer(scanLayers[k])) map.removeLayer(scanLayers[k]);
          }
        });

        setTimeout(updateSwipeClip, 50);
        updateSwipeClip();
      }
    }

    modeOverlayBtn.addEventListener('click', () => setMode('overlay'));
    modeSwipeBtn.addEventListener('click', () => setMode('swipe'));

    // Swipe dragging
    let isDragging = false;

    function startDrag(e) {
      isDragging = true;
      e.preventDefault();
      e.stopPropagation();
      document.body.style.cursor = 'ew-resize';
      document.body.style.userSelect = 'none';
    }

    function stopDrag() {
      if (isDragging) {
        isDragging = false;
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }
    }

    function doDrag(clientX) {
      if (!isDragging || currentMode !== 'swipe') return;
      const rect = map.getContainer().getBoundingClientRect();
      const x = Math.max(10, Math.min(rect.width - 10, clientX - rect.left));
      swipePercent = (x / rect.width) * 100;
      updateSwipeClip();
    }

    swipeDivider.addEventListener('mousedown', startDrag);
    window.addEventListener('mouseup', stopDrag);
    window.addEventListener('mousemove', (e) => doDrag(e.clientX));

    swipeDivider.addEventListener('touchstart', (e) => {
      startDrag(e);
    }, { passive: false });
    window.addEventListener('touchend', stopDrag);
    window.addEventListener('touchmove', (e) => {
      if (e.touches && e.touches[0]) doDrag(e.touches[0].clientX);
    }, { passive: false });

    // Update clip on map move/zoom/tileload
    map.on('move zoom viewreset resize', updateSwipeClip);
    Object.keys(scanLayers).forEach(k => {
      scanLayers[k].on('tileload load', () => {
        if (currentMode === 'swipe') updateSwipeClip();
      });
    });

  </script>
</body>
</html>
